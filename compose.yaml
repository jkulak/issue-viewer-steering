name: issue-viewer

# The project directories are not listed here: `make mounts` writes them into
# compose.override.yaml from PROJECTS in .env, and compose merges that file automatically.

services:
  app:
    build:
      context: .
      target: runtime
    image: issue-viewer:runtime
    env_file:
      - path: .env
        required: false
    ports:
      - "127.0.0.1:${PORT:-8090}:8080"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  dev:
    build:
      context: .
      target: dev
    image: issue-viewer:dev
    profiles: [dev]
    volumes:
      - .:/app
    environment:
      PYTEST_ADDOPTS: "-p no:cacheprovider"
      RUFF_CACHE_DIR: /tmp/ruff-cache

  # The production image on synthetic issues that the smoke and e2e tests write into e2e-data.
  e2e-app:
    build:
      context: .
      target: runtime
    image: issue-viewer:runtime
    profiles: [e2e]
    environment:
      PROJECTS: demo=/data/demo,archive=/data/archive:ro
      ALLOWED_HOSTS: e2e-app
      TZ: UTC
      REFRESH_SECONDS: "1"
      LOG_LEVEL: WARNING
    volumes:
      - e2e-data:/data
    read_only: true
    tmpfs:
      - /tmp

  e2e:
    build:
      context: .
      dockerfile: tests/e2e/Dockerfile
    image: issue-viewer:e2e
    profiles: [e2e]
    depends_on:
      e2e-app:
        condition: service_healthy
    environment:
      BASE_URL: http://e2e-app:8080
      DATA_DIR: /data
      PYTEST_ADDOPTS: "-p no:cacheprovider"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - e2e-data:/data
      - .:/work:ro
    working_dir: /work
    ipc: host

volumes:
  e2e-data:
