[project]
name = "issue-viewer"
version = "2026.9.0"
description = "A GitHub-like viewer and editor for issues kept as Markdown files in a project directory"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "uvicorn>=0.53",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1",
    "ruff>=0.16.8",
]
e2e = [
    "playwright==1.63.0",
    "pytest>=9.1",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
issue_viewer = ["templates/*.html", "static/*"]

[tool.uv]
default-groups = []

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# The task files write "–" and "·" on purpose, and the code and tests match them.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Expected file contents and HTML are clearer as one long literal than split across lines.
"tests/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/web"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    # Starlette would like httpx2 for its test client; httpx is the approved dependency and works.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
